flow: issue-to-reviewed-pr
version: v1
inputs:
  issue:
    source: github.issue
    read_only: true
  repository:
    source: github.repository
    read_only: true
profiles:
  local-fast:
    provider: local
    purpose: file-inventory-and-test-discovery
  subscription-cheap:
    provider: subscription
    purpose: bounded-reconnaissance-and-diff-review
  subscription-strong:
    provider: subscription
    purpose: planning-implementation-and-ambiguity
steps:
  - id: intake
    action: github.issue.read
    inputs: [issue]
    outputs: [requirements]
    risk: safe
  - id: inspect-files
    action: repository.inspect
    profile: local-fast
    inputs: [repository, requirements]
    outputs: [file_map]
    needs: [intake]
    risk: safe
  - id: inspect-tests
    action: repository.tests
    profile: local-fast
    inputs: [repository, requirements]
    outputs: [test_map]
    needs: [intake]
    risk: safe
  - id: inspect-history
    action: repository.history
    profile: subscription-cheap
    inputs: [repository, requirements]
    outputs: [related_changes]
    needs: [intake]
    risk: safe
  - id: plan
    action: model.plan
    profile: subscription-strong
    inputs: [requirements, file_map, test_map, related_changes]
    outputs: [implementation_plan]
    needs: [inspect-files, inspect-tests, inspect-history]
    risk: sensitive
  - id: implement
    action: repository.edit_worktree
    profile: subscription-strong
    inputs: [implementation_plan]
    outputs: [change_set]
    needs: [plan]
    risk: sensitive
    approval:
      action: propose_change
      required: true
  - id: verify
    action: repository.verify
    inputs: [change_set]
    outputs: [verification]
    needs: [implement]
    risk: safe
    format: json
  - id: review
    action: model.review_diff
    profile: subscription-cheap
    inputs: [requirements, change_set, verification]
    outputs: [review]
    needs: [verify]
    risk: sensitive
  - id: prepare-pr
    action: github.pull_request.draft
    inputs: [requirements, change_set, verification, review]
    outputs: [pull_request]
    needs: [review]
    risk: sensitive
    approval:
      action: create_pull_request
      required: true
policy:
  cost_budget_usd: 2.00
  network: approved-repositories-only
  external_writes: approval-required
  receipt: required
